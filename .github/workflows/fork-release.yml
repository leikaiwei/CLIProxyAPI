name: Fork release

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

concurrency:
  group: fork-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/leikaiwei/cliproxyapi

jobs:
  prepare:
    if: github.repository == 'leikaiwei/CLIProxyAPI' && github.ref == 'refs/heads/fork'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      upstream: ${{ steps.source.outputs.upstream }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fork
          fetch-depth: 0
      - name: Merge the latest upstream release
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/fork/sync.sh
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: steps.source.outputs.publish == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Test and compile the merged source
        if: steps.source.outputs.publish == 'true'
        run: |
          go test ./...
          go build -o "$RUNNER_TEMP/cli-proxy-api" ./cmd/server
      - name: Save the validated source
        if: steps.source.outputs.publish == 'true'
        run: |
          git push origin HEAD:refs/heads/fork
          git push origin refs/remotes/upstream/main:refs/heads/main

  image:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
      UPSTREAM: ${{ needs.prepare.outputs.upstream }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Build the image
        run: |
          docker build --file .github/fork/Dockerfile \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT="$SOURCE_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label org.opencontainers.image.source="https://github.com/leikaiwei/CLIProxyAPI" \
            --label org.opencontainers.image.revision="$SOURCE_SHA" \
            --label org.opencontainers.image.version="$VERSION" \
            --label io.cliproxyapi.upstream="$UPSTREAM" \
            --tag "$IMAGE:$VERSION-$ARCH" .
      - name: Verify the image over HTTP
        run: bash .github/fork/smoke.sh "$IMAGE:$VERSION-$ARCH"
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the architecture image
        run: docker push "$IMAGE:$VERSION-$ARCH"

  publish:
    needs: [prepare, image]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
      UPSTREAM: ${{ needs.prepare.outputs.upstream }}
    steps:
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the version and stable manifests
        run: |
          test "$(git ls-remote https://github.com/leikaiwei/CLIProxyAPI.git refs/heads/fork | cut -f1)" = "$SOURCE_SHA"
          docker manifest create "$IMAGE:$VERSION" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker manifest push --purge "$IMAGE:$VERSION"
          docker manifest inspect "$IMAGE:$VERSION" > manifest.json
          python3 -c 'import json; m=json.load(open("manifest.json")); assert {x["platform"]["architecture"] for x in m["manifests"]} == {"amd64", "arm64"}'
          docker manifest create "$IMAGE:stable" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker manifest push --purge "$IMAGE:stable"
          {
            printf 'Published `%s:%s` and `stable`\n\n' "$IMAGE" "$VERSION"
            printf 'Source `%s`, upstream `%s`\n' "$SOURCE_SHA" "$UPSTREAM"
          } >> "$GITHUB_STEP_SUMMARY"
